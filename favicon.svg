<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF"/>
      <stop offset="100%" style="stop-color:#00FFFF"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0d0d1a"/>
  
  <!-- Offset shadow rectangle -->
  <rect x="8" y="8" width="88" height="88" fill="none" stroke="#00FFFF" stroke-width="4"/>
  
  <!-- Main border -->
  <rect x="4" y="4" width="88" height="88" fill="none" stroke="#FF00FF" stroke-width="4"/>
  
  <!-- SP Text with gradient -->
  <text x="50" y="68" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="52" 
        font-weight="900"
        fill="url(#gradient)" 
        text-anchor="middle"
        letter-spacing="-2">SP</text>
  
  <!-- Glow effect text layer -->
  <text x="50" y="68" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="52" 
        font-weight="900"
        fill="none"
        stroke="#FF00FF"
        stroke-width="1"
        opacity="0.5"
        text-anchor="middle"
        letter-spacing="-2">SP</text>
</svg>
